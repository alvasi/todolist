name: ToDo List CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:

    runs-on: ubuntu-latest

    # Add PostgreSQL service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: todolist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: react-with-flask/api

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Node.js dependencies
      run: |
        npm install
      working-directory: react-with-flask

    - name: Wait for PostgreSQL to be ready
      run: |
        # Wait for PostgreSQL to accept connections
        for i in {1..30}; do
          if pg_isready -h localhost -U testuser; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Waiting for PostgreSQL... $i"
          sleep 2
        done
      env:
        PGPASSWORD: testpass

    - name: Create database tables
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/todolist_test
      run: |
        cd react-with-flask
        # Run your SQL schema
        PGPASSWORD=testpass psql -h localhost -U testuser -d todolist_test -f database_schema.sql
        echo "✓ Database tables created"

    - name: Lint backend with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test backend with pytest
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        pytest

    - name: Test frontend with vitest
      run: |
        npm test
      working-directory: react-with-flask
    
