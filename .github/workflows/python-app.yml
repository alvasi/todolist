name: To Do List CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Backend tests with Docker Compose
  flask-lint-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: react-with-flask/api
    
    - name: Start Docker Compose services
      run: |
        # Start the database service
        docker compose up -d db
        
        # Wait for database to be ready
        docker compose exec -T db pg_isready -U user -d todolist
        
        # Run the init script manually
        docker compose exec -T db psql -U user -d todolist -f /docker-entrypoint-initdb.d/01-init.sql
        
      working-directory: react-with-flask
    
    - name: Lint backend with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      working-directory: react-with-flask/api
    
    - name: Test backend with pytest
      env:
        DATABASE_URL: postgresql://user:password@localhost:5431/todolist  # Note: port 5431 from docker-compose
        SECRET_KEY: test-secret-key-for-ci
        FLASK_ENV: testing
      run: |
        pytest
      working-directory: react-with-flask/api
    
    - name: Stop Docker Compose services
      if: always()
      run: |
        docker compose down
      working-directory: react-with-flask

  # Frontend tests
  vite-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    
    - name: Install Node.js dependencies
      run: |
        npm install
      working-directory: react-with-flask
    
    - name: Test frontend with vitest
      run: |
        npm test
      working-directory: react-with-flask

  # Test Docker Compose build
  docker-build-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # - name: Build Docker images
    #   run: |
    #     docker compose build
    #   working-directory: react-with-flask
    
    - name: Start all services and verify they work
      run: |
        docker compose up -d
        sleep 10
        docker compose ps
        docker compose logs api
      working-directory: react-with-flask
    
    - name: Stop services
      if: always()
      run: |
        docker compose down
      working-directory: react-with-flask

